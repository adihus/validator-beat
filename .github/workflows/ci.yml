name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn validate-operators
      - run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: https://adihus.github.io/validator-beat
          NEXT_PUBLIC_BASE_PATH: /validator-beat
